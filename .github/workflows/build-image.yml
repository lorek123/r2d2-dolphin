name: Build Armbian Image

on:
  # Manual trigger — set version to publish a GitHub Release
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0). Leave empty to build artifact only.'
        required: false
        default: ''
      board:
        description: 'Armbian board name'
        required: false
        default: 'orangepizeroplus2-h5'
      release:
        description: 'Debian release'
        required: false
        default: 'bookworm'
      branch:
        description: 'Kernel branch (current / edge / legacy)'
        required: false
        default: 'current'

  # Auto-build + release on version tags
  push:
    tags:
      - 'v*'

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    name: Build R2D2 Armbian image
    # ------------------------------------------------------------------
    # Free GitHub runners: ubuntu-22.04 (2 vCPU, 7 GB RAM, ~14 GB disk)
    # The "Free disk space" step recovers ~20 GB — enough for Armbian.
    #
    # For faster builds use a self-hosted runner (Ubuntu 22.04, 60 GB+):
    #   Settings → Actions → Runners → New self-hosted runner
    #   Then change runs-on below to: self-hosted
    # ------------------------------------------------------------------
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ----------------------------------------------------------------
      # 0. Free disk space
      # ----------------------------------------------------------------
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "After:"; df -h /

      # ----------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------------------------------
      # 2. Resolve parameters
      # ----------------------------------------------------------------
      - name: Set build parameters
        id: params
        run: |
          BOARD="${{ github.event.inputs.board || 'orangepizeroplus2-h5' }}"
          RELEASE="${{ github.event.inputs.release || 'bookworm' }}"
          BRANCH="${{ github.event.inputs.branch || 'current' }}"

          # Version: explicit input > tag name > date-based dev build
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            CREATE_RELEASE=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
            CREATE_RELEASE=true
          else
            VERSION="dev-$(date +%Y%m%d-%H%M)"
            CREATE_RELEASE=false
          fi

          echo "board=$BOARD"               >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE"           >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"             >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "create_release=$CREATE_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Board=$BOARD  Release=$RELEASE  Branch=$BRANCH  Version=$VERSION  PublishRelease=$CREATE_RELEASE"

      # ----------------------------------------------------------------
      # 3. Install host dependencies
      # ----------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git dialog u-boot-tools qemu-user-static \
            binfmt-support debootstrap rsync \
            bc bison flex libssl-dev libncurses5-dev

      # ----------------------------------------------------------------
      # 4. Cache Armbian toolchain + downloaded packages
      # ----------------------------------------------------------------
      - name: Cache Armbian build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .armbian-build/cache/toolchain
            .armbian-build/cache/rootfs
            .armbian-build/cache/sources
          key: armbian-${{ steps.params.outputs.board }}-${{ steps.params.outputs.release }}-${{ steps.params.outputs.branch }}-${{ hashFiles('armbian/userpatches/customize-image.sh', 'python/requirements.txt') }}
          restore-keys: |
            armbian-${{ steps.params.outputs.board }}-${{ steps.params.outputs.release }}-${{ steps.params.outputs.branch }}-
            armbian-${{ steps.params.outputs.board }}-${{ steps.params.outputs.release }}-

      # ----------------------------------------------------------------
      # 5. Clone Armbian build system
      # ----------------------------------------------------------------
      - name: Clone Armbian build system
        run: |
          if [[ ! -d .armbian-build/.git ]]; then
            git clone --depth=1 https://github.com/armbian/build.git .armbian-build
          else
            git -C .armbian-build pull --ff-only || true
          fi

      # ----------------------------------------------------------------
      # 6. Prepare userpatches + overlay
      # ----------------------------------------------------------------
      - name: Prepare userpatches and overlay
        run: |
          OVERLAY=".armbian-build/userpatches/overlay"

          # Copy userpatches (customize-image.sh + static small overlay files)
          # Note: Python code + armbian scripts are cloned by customize-image.sh
          # directly from GitHub inside the ARM64 chroot (internet is available).
          cp -r armbian/userpatches/. .armbian-build/userpatches/
          chmod +x .armbian-build/userpatches/customize-image.sh

          # Small overlay: only static config files that must pre-exist on rootfs
          echo "--- Overlay contents ---"
          find "$OVERLAY" -type f | sort || echo "(overlay is empty — code is cloned at build time)"

      # ----------------------------------------------------------------
      # 7. Build image
      # ----------------------------------------------------------------
      - name: Build Armbian image
        run: |
          cd .armbian-build
          sudo ./compile.sh \
            BOARD="${{ steps.params.outputs.board }}" \
            RELEASE="${{ steps.params.outputs.release }}" \
            BRANCH="${{ steps.params.outputs.branch }}" \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,xz \
            EXPERT=yes \
            USE_DOCKER=no
        env:
          TERM: xterm

      # ----------------------------------------------------------------
      # 8. Collect + rename output
      # ----------------------------------------------------------------
      - name: Collect output
        id: image
        run: |
          IMG=$(find .armbian-build/output/images -name "*.img.xz" | head -1)
          [[ -z "$IMG" ]] && { echo "No image found"; ls .armbian-build/output/images/; exit 1; }

          NAME="r2d2-${{ steps.params.outputs.version }}-${{ steps.params.outputs.board }}.img.xz"
          sudo mv "$IMG" "$NAME"

          SHA=$(find .armbian-build/output/images -name "*.sha" | head -1)
          [[ -n "$SHA" ]] && sudo mv "$SHA" "${NAME%.xz}.sha" || sha256sum "$NAME" > "${NAME%.xz}.sha"

          echo "name=$NAME"       >> "$GITHUB_OUTPUT"
          echo "sha=${NAME%.xz}.sha" >> "$GITHUB_OUTPUT"
          echo "$NAME ($(du -sh "$NAME" | cut -f1))"

      # ----------------------------------------------------------------
      # 9. Upload as workflow artifact (always, 30-day retention)
      # ----------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: r2d2-image-${{ steps.params.outputs.version }}
          path: |
            ${{ steps.image.outputs.name }}
            ${{ steps.image.outputs.sha }}
          retention-days: 30

      # ----------------------------------------------------------------
      # 10. Tag commit if version came from workflow_dispatch input
      #     (tag-triggered builds already have the tag; skip those)
      # ----------------------------------------------------------------
      - name: Create git tag
        if: steps.params.outputs.create_release == 'true' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.params.outputs.version }}" -m "Release ${{ steps.params.outputs.version }}"
          git push origin "${{ steps.params.outputs.version }}"

      # ----------------------------------------------------------------
      # 11. Publish GitHub Release
      # ----------------------------------------------------------------
      - name: Create GitHub Release
        if: steps.params.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.params.outputs.version }}
          name: R2D2 Armbian ${{ steps.params.outputs.version }}
          body: |
            ## R2D2 Armbian Image — ${{ steps.params.outputs.version }}

            **Board:** ${{ steps.params.outputs.board }}
            **OS:** Armbian ${{ steps.params.outputs.release }} (${{ steps.params.outputs.branch }} kernel)

            ### Flash
            ```bash
            # Linux / macOS
            xz -d r2d2-*.img.xz
            sudo dd if=r2d2-*.img of=/dev/sdX bs=4M status=progress conv=fsync

            # Windows: use Balena Etcher — open the .img.xz directly
            ```

            ### First boot
            | | |
            |---|---|
            | R2D2 AP | `R2D2-XXXXXX` (open, no password) |
            | Original Android app | `ws://192.168.4.1:8765` |
            | Portal / home WiFi setup | `http://192.168.4.1/` |
            | After joining home WiFi | `ws://r2d2.local:8765` |
          files: |
            ${{ steps.image.outputs.name }}
            ${{ steps.image.outputs.sha }}
          draft: false
          prerelease: ${{ contains(steps.params.outputs.version, 'rc') || contains(steps.params.outputs.version, 'beta') || contains(steps.params.outputs.version, 'alpha') }}
